services:
  - type: web
    name: ielts-api
    runtime: node
    plan: free
    # --include=dev: the build needs tsup/typescript, but NODE_ENV=production
    # would otherwise make npm skip devDependencies.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Public URL of the web app, used to build verification / reset links.
      - key: APP_URL
        sync: false
      # Optional. Without it, links are printed to the Render logs instead.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: IELTS Practice <onboarding@resend.dev>
      - key: REGISTRATION_OPEN
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_HOURLY_LIMIT
        value: "20"
      - key: AUTO_MIGRATE
        value: "true"
