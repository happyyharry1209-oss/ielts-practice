services:
  - type: web
    name: ielts-api
    runtime: node
    plan: free
    # --include=dev: the build needs tsup/typescript, but NODE_ENV=production
    # would otherwise make npm skip devDependencies.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      # Public URL of the web app, used to build verification / reset links.
      - key: APP_URL
        sync: false
      # SMTP delivery (Gmail, Brevo, …). Takes priority over Resend.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Alternative to SMTP. Without either, links are printed to the logs.
      - key: RESEND_API_KEY
        sync: false
      - key: REGISTRATION_OPEN
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_HOURLY_LIMIT
        value: "20"
      - key: AUTO_MIGRATE
        value: "true"
